<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hamster Empreendedor – jogo de finanças</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="frame">
    <i class="knob l"></i><i class="knob r"></i>
    <div class="screen" id="screen">
      <span class="spark" style="left:18%;top:30%">✦</span>
      <span class="spark" style="left:70%;top:20%;animation-delay:.7s">✦</span>
      <span class="spark" style="left:10%;top:55%;animation-delay:1.3s">✦</span>
      <span class="spark" style="left:82%;top:48%;animation-delay:1.9s">✦</span>
      <div class="deco" id="decoL" style="left:20px"></div>
      <div class="deco" id="decoR" style="right:20px"></div>
      <div id="hudbox"></div>
      <div class="main" id="main"></div>
      <div class="tree" id="tree"></div>
      <div class="ham" id="ham"></div>
      <div class="ground"></div>
    </div>
  </div>

  <!-- A ordem importa: configurações/arte, perguntas e, por último, motor do jogo. -->
  <script src="./aleatorio.js"></script>
  <script src="./perguntas.js"></script>
  <script src="./script.js"></script>
</body>
</html>
